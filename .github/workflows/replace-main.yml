name: Replace main with final production project

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/replace-main.yml'

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace repository contents with final project
        shell: bash
        run: |
          set -euo pipefail
          test -f riyadh-glass-production-final.zip
          rm -rf /tmp/riyadh-final
          mkdir -p /tmp/riyadh-final
          base64 -d riyadh-glass-production-final.zip > /tmp/riyadh-final/final.zip
          unzip -q /tmp/riyadh-final/final.zip -d /tmp/riyadh-final/extracted
          test -f /tmp/riyadh-final/extracted/rg_final/package.json
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/riyadh-final/extracted/rg_final/. .
          rm -rf .github
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace main with final clean Riyadh Glass project"
          git push origin HEAD:main
