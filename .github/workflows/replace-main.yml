name: Replace main with final production project

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/replace-main.yml'

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Restore verified staged production payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/riyadh-final
          mkdir -p /tmp/riyadh-final/extracted /tmp/riyadh-final/stage

          # Pull the complete staged payload from the preserved production branch.
          git checkout origin/production-clean-2026 -- .import-xz
          cat .import-xz/payload.part-* > /tmp/riyadh-final/archive.b64
          base64 -d /tmp/riyadh-final/archive.b64 > /tmp/riyadh-final/archive.xz
          xz -t /tmp/riyadh-final/archive.xz
          xz -dc /tmp/riyadh-final/archive.xz > /tmp/riyadh-final/payload

          if unzip -tq /tmp/riyadh-final/payload >/dev/null 2>&1; then
            unzip -q /tmp/riyadh-final/payload -d /tmp/riyadh-final/extracted
          elif tar -tf /tmp/riyadh-final/payload >/dev/null 2>&1; then
            tar -xf /tmp/riyadh-final/payload -C /tmp/riyadh-final/extracted
          else
            echo 'Unsupported recovered payload format'
            file /tmp/riyadh-final/payload || true
            exit 1
          fi

          if test -f /tmp/riyadh-final/extracted/package.json; then
            PROJECT_ROOT=/tmp/riyadh-final/extracted
          else
            PROJECT_ROOT="$(find /tmp/riyadh-final/extracted -mindepth 1 -maxdepth 4 -type f -name package.json -printf '%h\n' | head -n 1)"
          fi

          test -n "${PROJECT_ROOT:-}"
          test -f "$PROJECT_ROOT/package.json"
          test -f "$PROJECT_ROOT/index.html"

          # These files identify the reviewed/fixed production project, not the old flat source tree.
          test -f "$PROJECT_ROOT/src/App.tsx"
          test -f "$PROJECT_ROOT/netlify/functions/ai.mjs"
          test -f "$PROJECT_ROOT/server/ai-core.js"
          test -f "$PROJECT_ROOT/supabase/migrations/20260812_ai_crm_upgrade.sql"

          # Replace main with only the production project.
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$PROJECT_ROOT"/. .
          rm -rf .upload .import .import-xz
          rm -f riyadh-glass-production-final.zip
          rm -f .github/workflows/replace-main.yml
          find . -type d -empty -delete || true

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No changes to commit'; exit 0; }
          git commit -m 'Replace main with final clean Riyadh Glass project'
          git push origin HEAD:main
